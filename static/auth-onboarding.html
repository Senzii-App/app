  <style>
    html, body { height: 100%; }
    .auth-wrap { width: 100%; max-width: 400px; padding: 1.5rem; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; }
    .auth-logo { text-align: center; margin-bottom: 2rem; }
    .auth-logo span { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: var(--accent); letter-spacing: -0.02em; }
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 2rem; }
    .auth-title { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--text); }
    .auth-icon-circle { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: var(--accent-dim); border-radius: 50%; margin-bottom: 1rem; }
    .auth-body { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.7; }
    .auth-note { font-size: 0.8rem; color: var(--text-muted); line-height: 1.6; }
    .auth-divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    .auth-link { font-size: 0.82rem; color: var(--accent); text-decoration: none; }
    .auth-link:hover { color: #15803d; }
  </style>
</head>

  </div>
